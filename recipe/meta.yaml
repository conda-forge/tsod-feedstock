{% set name = "tsod" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 14019b934c93b287b05c6ec05a6de1278487533eecd8e66267ca0bb46807dc40

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python  >=3.6
    - pip
  run:
    - python  >=3.6
    - numpy
    - pandas
    - joblib
    - numba

test:
  imports:
    - tsod
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/DHI/tsod

  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Anomaly Detection for time series data
  doc_url: https://dhi.github.io/tsod/

extra:
  recipe-maintainers:
    - ecomodeller
